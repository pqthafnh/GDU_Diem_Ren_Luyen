services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gdu_event_training
      POSTGRES_USER: gdu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdu -d gdu_event_training"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_QR_SECRET: ${JWT_QR_SECRET:?JWT_QR_SECRET must be set}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET must be set}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
